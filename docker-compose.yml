services:
  copy:
    build: .
    container_name: polymoney
    restart: unless-stopped          # авто-рестарт при падении и после ребута сервера
    environment:
      DASH_HOST: "0.0.0.0"
      DASH_PORT: "5000"
      BANKROLL: "10000"
      PER_TRADE: "10"
      CORE_BANKROLL: "15000"           # жёсткий депозит core-группы (без доливов)
      INTERVAL: "60"                 # цикл стал лёгким (редкий скан позиций) -> опрашиваем чаще
      # БЕЗОПАСНОСТЬ: пароль действий берётся из СЕРВЕРНОГО .env (gitignored), НЕ пишется здесь —
      # этот файл публичный. Нет ADMIN_PASS -> пишущие эндпоинты выключены (дашборд только на чтение).
      # На сервере: echo "ADMIN_PASS=<длинный-случайный>" > /root/polymoney/.env   (docker compose
      # автоматически подхватывает .env из папки рядом). Потом docker compose up -d --force-recreate.
      ADMIN_PASS: "${ADMIN_PASS:-}"
      # Токен ленты сигналов (/api/signals): задай в том же серверном .env (SIGNALS_TOKEN=<случайный>),
      # и лента закроется от посторонних (по ней живёт реальный бот — открытая лента раздаёт альфу).
      # Локальный исполнитель шлёт его из polymarket.env. Пусто = лента открыта (как раньше).
      SIGNALS_TOKEN: "${SIGNALS_TOKEN:-}"
    ports:
      - "5000:5000"                  # открыт по http://IP:5000 (бумага, без ключей — ок)
    volumes:
      - .:/app                       # состояние (paper_book, watchlist, perf_history) живёт на хосте
